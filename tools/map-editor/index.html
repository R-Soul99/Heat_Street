<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Heat Street map editor (dev only)</title>
    <link rel="stylesheet" href="../editor-shell/shell.css" />
    <style>
      #map { cursor: crosshair; }
      #legend { position: absolute; left: 70px; bottom: 36px; z-index: 9; display: none; padding: 6px 8px; background: rgba(29, 32, 38, 0.92); border: 1px solid #333; }
      #legend span { display: block; }
      .sw { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: middle; }
      #log-text { white-space: pre-wrap; font: 11px monospace; max-height: 60vh; min-width: 50ch; overflow: auto; background: #0c0d10; padding: 6px; }
      dialog label { display: block; margin: 6px 0 2px; color: #9aa; }
      dialog select, dialog input[type="text"], dialog input[type="number"] { box-sizing: border-box; background: #111; color: #eee; border: 1px solid #444; padding: 4px; }
      .warn { color: #fb4; margin: 4px 0; }
      .ro { color: #9aa; margin: 2px 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="map" class="shell-canvas"></canvas>
      <div id="legend"></div>
    </div>
    <dialog id="legacy-new">
      <h3>New world</h3>
        <label for="nw-id">Id (a-z, 0-9, -)</label>
        <input type="text" id="nw-id" placeholder="my-world" />
        <label for="nw-w">Width (km)</label>
        <input type="number" id="nw-w" value="6" min="0.5" max="10" step="0.5" />
        <label for="nw-h">Height (km)</label>
        <input type="number" id="nw-h" value="6" min="0.5" max="10" step="0.5" />
        <button type="button" id="nw-create">Create</button>
      <form method="dialog"><button type="submit">Close</button></form>
    </dialog>
    <dialog id="legacy-import">
      <h3>Import image</h3>
        <input type="file" id="im-file" accept="image/png,image/jpeg" />
        <label for="im-thr">Threshold: <span id="im-thr-v">128</span> (darker = road)</label>
        <input type="range" id="im-thr" min="0" max="255" value="128" />
        <label for="im-km">Real width (km)</label>
        <input type="number" id="im-km" min="0.01" step="0.01" />
        <label for="im-mpp">Metres per pixel</label>
        <input type="number" id="im-mpp" min="0.01" step="0.05" />
        <div class="ro" id="im-derived">no image loaded</div>
        <label for="im-ox">Offset X (m from world SW corner)</label>
        <input type="number" id="im-ox" value="0" step="10" />
        <label for="im-oy">Offset Y (m from world SW corner)</label>
        <input type="number" id="im-oy" value="0" step="10" />
        <label for="im-width">Road width (m)</label>
        <input type="number" id="im-width" value="8" min="2" max="40" step="0.5" />
        <label for="im-hw">Highway class</label>
        <select id="im-hw"></select>
        <label for="im-surf">Surface</label>
        <select id="im-surf"></select>
        <details>
          <summary>Advanced tracing (pixels)</summary>
          <label for="im-spur">Prune spurs shorter than (px)</label>
          <input type="number" id="im-spur" min="0" step="1" />
          <label for="im-simp">Simplify tolerance (px)</label>
          <input type="number" id="im-simp" min="0" step="0.1" />
          <label for="im-smooth">Smoothing passes</label>
          <input type="number" id="im-smooth" min="0" max="5" step="1" />
        </details>
        <div class="warn" id="im-warn"></div>
        <button type="button" id="im-preview">Preview</button>
        <button type="button" id="im-go" class="primary">Import roads</button>
      <form method="dialog"><button type="submit">Close</button></form>
    </dialog>
    <dialog id="log-dialog">
      <h3>Compile log</h3>
      <div id="log-text">No compile has run yet.</div>
      <form method="dialog"><button type="submit">Close</button></form>
    </dialog>
    <script type="module" src="./editor.ts"></script>
  </body>
</html>
