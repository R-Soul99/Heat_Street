<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Heat Street map editor (dev only)</title>
    <link rel="stylesheet" href="../editor-shell/shell.css" />
    <style>
      #map { cursor: crosshair; }
      #legend { position: absolute; left: 70px; bottom: 36px; z-index: 9; display: none; padding: 6px 8px; background: rgba(29, 32, 38, 0.92); border: 1px solid #333; }
      #legend span { display: block; }
      .sw { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: middle; }
      #log-text { white-space: pre-wrap; font: 11px monospace; max-height: 60vh; min-width: 50ch; overflow: auto; background: #0c0d10; padding: 6px; }
      dialog label { display: block; margin: 6px 0 2px; color: #9aa; }
      dialog select, dialog input[type="text"], dialog input[type="number"] { box-sizing: border-box; background: #111; color: #eee; border: 1px solid #444; padding: 4px; }
      .warn { color: #fb4; margin: 4px 0; }
      .ro { color: #9aa; margin: 2px 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="map" class="shell-canvas"></canvas>
      <div id="legend"></div>
    </div>
    <dialog id="log-dialog">
      <h3>Compile log</h3>
      <div id="log-text">No compile has run yet.</div>
      <form method="dialog"><button type="submit">Close</button></form>
    </dialog>
    <script type="module" src="./editor.ts"></script>
  </body>
</html>
