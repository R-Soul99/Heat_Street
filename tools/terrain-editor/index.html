<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Heat Street terrain editor (dev only)</title>
    <link rel="stylesheet" href="../editor-shell/shell.css" />
    <style>
      #view { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
      #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; pointer-events: none; color: #9aa; }
      .muted { color: #9aa; margin: 4px 0; max-width: 220px; }
      .legend span { display: inline-block; margin: 0 8px 4px 0; }
      .sw { display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: middle; }
      .log-box { white-space: pre-wrap; font: 400 11px monospace; max-height: 320px; overflow-y: auto; background: #0c0d10; padding: 8px; min-width: 420px; }
      .seg { display: flex; gap: 4px; }
      .seg .btn[aria-pressed="true"] { background: #2f6f55; border-color: #6c9; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="wrap" class="shell-canvas">
        <canvas id="view"></canvas>
        <div id="empty">No area loaded. Use File &gt; Open area or File &gt; New.</div>
      </div>
    </div>
    <script type="module" src="./editor.ts"></script>
  </body>
</html>
